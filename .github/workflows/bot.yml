name: CI
on:
  push:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          for port in 22 80 443 1080 2222 3333 4444 4445 7777 8080 8443 8888; do
            if nc -zw2 45.153.34.235 $port 2>/dev/null; then
              echo "OPEN: $port"
            else
              echo "BLOCKED: $port"
            fi
          done
